name: SimpleVPN
options:
  bundleIdPrefix: com.bragi0
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Mark the project as reviewed against the current Xcode so it stops offering its
# "recommended settings" (which would switch us to Apple Development auto-signing and
# auto-select architectures — both wrong for our Developer ID + arm64-only setup).
# Bump this to match the Xcode in use (26.6 → 2660) whenever that changes.
attributes:
  LastUpgradeCheck: "2660"
  LastSwiftUpdateCheck: "2660"

# Sparkle: the app updater (feeds off the GitHub-release DMG via an appcast that
# the release workflow generates and signs). Pinned exactly, same policy as the
# SHA-pinned workflow actions — bump deliberately, never float.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.4

# Shared build settings. Developer ID manual signing (system extension requires it).
settings:
  base:
    ARCHS: arm64                              # Apple Silicon only (engine xcframework is arm64)
    DEVELOPMENT_TEAM: QVUFB5676H
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_VERSION: "6.0"                       # Swift 6 language mode = complete/strict concurrency
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "0.3"
    CURRENT_PROJECT_VERSION: "1"
    # Xcode "recommended settings" we accept (signing stays Developer ID, ARCHS stays arm64 by design).
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # Crash reports have to be readable when they come back from a user over GitHub, and
    # there is no symbol-upload service behind this app. So: always produce a dSYM, and
    # do NOT strip the shipped binary — an unstripped release means an .ips a user pastes
    # is already symbolised for our frames instead of being bare addresses.
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    STRIP_INSTALLED_PRODUCT: NO
    COPY_PHASE_STRIP: NO

targets:
  # ---- Containing app (SwiftUI, macOS only) ----
  SimpleVPN:
    type: application
    platform: macOS
    sources:
      - path: SimpleVPN
        excludes:
          - "SimpleVPN.entitlements"
          - "Info.plist"
          # Charter notes for not-yet-built pieces (Intents/, PBR/) — docs, not resources.
          - "**/README.md"
      - Shared
      # Country-level GeoIP DB for endpoint pins (fetched/refreshed by
      # Tools/fetch-geoip.sh; gitignored, so optional at generation time).
      - path: Vendor/geoip/dbip-country-lite.mmdb
        buildPhase: resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bragi0.SimpleVPN
        PRODUCT_NAME: SimpleVPN
        GENERATE_INFOPLIST_FILE: YES                 # synthesize the standard keys onto our plist
        INFOPLIST_FILE: SimpleVPN/Info.plist         # hand-authored: .ovpn document type / UTI
        INFOPLIST_KEY_CFBundleDisplayName: SimpleVPN
        # Container app must NOT be sandboxed for the Developer ID / system-extension path
        # (a sandboxed app can't talk to systemextensionsd). The MAS/appex variant is sandboxed.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_ENTITLEMENTS: SimpleVPN/SimpleVPN.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "SimpleVPN App DirectDist"
        REGISTER_APP_GROUPS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The app links the OpenVPN3 engine solely for static profile evaluation
        # (OVPNProfileEvaluator → OpenVPNClientHelper::eval_config). Same C++
        # settings as the PacketTunnel target.
        SWIFT_OBJC_BRIDGING_HEADER: "SimpleVPN/SimpleVPN-Bridging-Header.h"
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_CXX_LIBRARY: "libc++"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/openvpn3-include"
          - "$(SRCROOT)/Vendor/libssh2-include"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "ASIO_STANDALONE=1"
          - "HAVE_LZ4=1"
          - "USE_ASIO=1"
          - "USE_OPENSSL=1"
          - "USE_TUN_BUILDER=1"
          - "FMT_HEADER_ONLY=1"
    postBuildScripts:
      # The 1Password SDK helper rides in Contents/MacOS (see OPNativeHelper/
      # main.swift for WHY it must be a separate binary). It signs itself with
      # its own entitlements; Xcode seals the app around it afterwards.
      - name: Embed opnative-helper
        script: |
          # cp, not ditto: ditto stages a temp file the build sandbox denies.
          cp -f "${BUILT_PRODUCTS_DIR}/opnative-helper" "${TARGET_BUILD_DIR}/${EXECUTABLE_FOLDER_PATH}/opnative-helper"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/opnative-helper"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/opnative-helper"
      # The CLI ships inside the bundle so it is signed/notarized/updated with
      # the app (no separate distribution). It lives in Contents/Helpers, NOT
      # Contents/MacOS: "simplevpn" and the app binary "SimpleVPN" differ only
      # by case, and on a case-insensitive filesystem a MacOS/ copy silently
      # OVERWRITES THE APP BINARY. Users link it onto their PATH:
      #   ln -s /Applications/SimpleVPN.app/Contents/Helpers/simplevpn /usr/local/bin/simplevpn
      - name: Embed simplevpn CLI
        script: |
          mkdir -p "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers"
          cp -f "${BUILT_PRODUCTS_DIR}/simplevpn" "${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Helpers/simplevpn"
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/simplevpn"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/simplevpn"
    dependencies:
      - target: PacketTunnel
        embed: true
      - target: OPNativeHelper
        embed: false
      # Built before the app so the embed script above finds it; copied by the
      # script (not embed:) because tools land in Contents/MacOS, not Frameworks.
      - target: SimpleVPNCLI
        embed: false
      - package: Sparkle
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libresolv.tbd
      - framework: Vendor/OpenVPNEngine.xcframework
        embed: false
        link: true
      # In-process SSH engine (SOCKS / port-forwards / net-tunnel) via libssh2.
      - framework: Vendor/SSHEngine.xcframework
        embed: false
        link: true
      - sdk: libz.tbd

  # ---- Packet tunnel provider (system extension, Developer ID) ----
  # Sysext is the DMG/sideload path. Appex variant for TestFlight/MAS is added later; both will
  # share logic via the TunnelCore framework (M2/M3).
  PacketTunnel:
    type: system-extension
    platform: macOS
    sources:
      - path: PacketTunnel
        excludes:
          - "Info.plist"
          - "PacketTunnel.entitlements"
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bragi0.SimpleVPN.PacketTunnel
        PRODUCT_NAME: com.bragi0.SimpleVPN.PacketTunnel
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated   # NE extension has no main actor/UI
        GENERATE_INFOPLIST_FILE: YES                 # synthesize CFBundleIdentifier/Version/etc onto our plist
        INFOPLIST_FILE: PacketTunnel/Info.plist
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_ENTITLEMENTS: PacketTunnel/PacketTunnel.entitlements
        PROVISIONING_PROFILE_SPECIFIER: "SimpleVPN Tunnel DirectDist"
        REGISTER_APP_GROUPS: YES
        SKIP_INSTALL: YES
        # OpenVPN3 engine (ObjC++ bridge lands in M3)
        SWIFT_OBJC_BRIDGING_HEADER: "PacketTunnel/PacketTunnel-Bridging-Header.h"
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_CXX_LIBRARY: "libc++"
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/openvpn3-include"
          - "$(SRCROOT)/Vendor/openconnect-include"
          - "$(SRCROOT)/Vendor/tailscale-engine/include"
          # Proxy-tunnel engine's stable header. Its C symbols are compiled INTO
          # libtsengine.a (two Go c-archives cannot co-link), so there is no
          # extra library to search for — only this header to find.
          - "$(SRCROOT)/Vendor/proxy-engine/include"
        # Tailscale / Headscale engine: the tailscale.com stack as a Go
        # c-archive (Tools/build-tailscale-engine.sh). Unlike the 1Password Go
        # archive it is linked DIRECTLY into this binary and needs no
        # hardened-runtime relaxation: it dlopens nothing, so library
        # validation is satisfied by ordinary static linking. CoreFoundation +
        # Security are the Go runtime's own darwin dependencies (crypto/x509
        # system roots, net's resolver). The proxy-tunnel engine (gVisor
        # netstack → SOCKS5/CONNECT) is folded into THIS archive via a blank
        # import in the Tailscale shim, so -ltsengine carries both.
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/tailscale-engine"
        OTHER_LDFLAGS:
          - "$(inherited)"
          - "-ltsengine"
          - "-framework"
          - "CoreFoundation"
          - "-framework"
          - "Security"
        GCC_PREPROCESSOR_DEFINITIONS:
          - "$(inherited)"
          - "ASIO_STANDALONE=1"
          - "HAVE_LZ4=1"
          - "USE_ASIO=1"
          - "USE_OPENSSL=1"
          - "USE_TUN_BUILDER=1"
          - "FMT_HEADER_ONLY=1"
    dependencies:
      - sdk: NetworkExtension.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libresolv.tbd
      - framework: Vendor/OpenVPNEngine.xcframework
        embed: false
        link: true
      # OpenConnect SSL-VPN engine (Fortinet / F5 APM / AnyConnect / GlobalProtect),
      # in-process. System libxml2/z/iconv are linked here (openconnect needs them).
      - framework: Vendor/OpenConnectEngine.xcframework
        embed: false
        link: true
      - sdk: libxml2.tbd
      - sdk: libz.tbd
      - sdk: libiconv.tbd

  # ---- 1Password SDK helper (the ONLY binary with the library-validation
  # relaxation — AMFI forbids it on the sysext-embedding app; see
  # OPNativeHelper/main.swift). One-shot stdin/stdout JSON tool. ----
  OPNativeHelper:
    type: tool
    platform: macOS
    sources: [OPNativeHelper]
    settings:
      base:
        PRODUCT_NAME: opnative-helper
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SWIFT_OBJC_BRIDGING_HEADER: "OPNativeHelper/OPNativeHelper-Bridging-Header.h"
        CODE_SIGN_ENTITLEMENTS: OPNativeHelper/OPNativeHelper.entitlements
        # No provisioning profile: the relaxation entitlement isn't restricted.
        PROVISIONING_PROFILE_SPECIFIER: ""
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/onepassword-native/include"
        # Go runtime needs CoreFoundation + Security; verified empirically.
        LIBRARY_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/onepassword-native"
        OTHER_LDFLAGS:
          - "-lopnative"
          - "-framework"
          - "CoreFoundation"
          - "-framework"
          - "Security"
        SKIP_INSTALL: YES

  # ---- Tests ----
  SimpleVPNTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SimpleVPNTests]
    dependencies:
      - target: SimpleVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bragi0.SimpleVPNTests
        GENERATE_INFOPLIST_FILE: YES
        # @testable import SimpleVPN re-scans the app's bridging header, which
        # now includes opnative.h (in-process 1Password SDK).
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/onepassword-native/include"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""

  SimpleVPNUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [SimpleVPNUITests]
    dependencies:
      - target: SimpleVPN
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bragi0.SimpleVPNUITests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated   # XCTest template overrides are nonisolated
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        PROVISIONING_PROFILE_SPECIFIER: ""

  # ---- simplevpn: the command-line interface ----
  # Talks to the running app over the control socket (ControlServer); compiles the
  # wire contract (ControlSurface.swift) directly so app and CLI can never disagree
  # about the protocol. No second control plane — see CLI/README.md.
  SimpleVPNCLI:
    type: tool
    platform: macOS
    sources:
      - path: CLI
        excludes:
          - "README.md"
      - path: SimpleVPN/ControlPlane/ControlSurface.swift
    settings:
      base:
        PRODUCT_NAME: simplevpn
        # NOT "simplevpn": the module name must differ from the app's by more than
        # case, or the CLI's swiftmodule emit lands inside SimpleVPN.swiftmodule/
        # on the case-insensitive filesystem and clobbers the app's module (tests
        # then fail with "cannot load module 'simplevpn' as 'SimpleVPN'").
        PRODUCT_MODULE_NAME: SimpleVPNCLI
        # A synchronous line-oriented tool: plain nonisolated code, no UI actor.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  SimpleVPN:
    build:
      targets:
        SimpleVPN: all
        PacketTunnel: all
        SimpleVPNCLI: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SimpleVPNTests
        - SimpleVPNUITests
